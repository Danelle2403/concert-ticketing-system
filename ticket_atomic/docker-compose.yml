version: "3.9"

services:
  ticket-service:
    build: .
    container_name: ticket-service
    ports:
      - "5000:5000"
    environment:
      # Paste your Supabase connection string here, or put it in a .env file
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
