_format_version: "2.1"
_transform: true

consumers:
  - username: concert-hub-ui
    jwt_secrets:
      - key: concert-hub-ui
        algorithm: HS256
        secret: concert-hub-local-dev-secret-2026

services:

  - name: user-service
    url: http://user-service:5000
    routes:
      - name: auth-routes
        paths:
          - /auth
        strip_path: false
      - name: user-protected-routes
        paths:
          - /user/events
          - /user/managing
        methods:
          - GET
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: event-service
    url: http://event-service:5000
    routes:
      - name: event-routes
        paths:
          - /events
        methods:
          - GET
        strip_path: false

  - name: purchase-composite
    url: http://purchase-composite:5000
    routes:
      - name: purchase-routes
        paths:
          - /purchase
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: refund-composite
    url: http://refund-composite:5000
    routes:
      - name: refund-routes
        paths:
          - /refunds
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: edit-event-composite
    url: http://edit-event-composite:5000
    routes:
      - name: manager-event-routes
        paths:
          - /manager/events
        methods:
          - GET
          - PUT
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp
      - name: manager-event-alias-routes
        paths:
          - /events
        methods:
          - PUT
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp
