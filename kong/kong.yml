_format_version: "2.1"
_transform: true

consumers:
  - username: concert-hub-ui
    jwt_secrets:
      - key: concert-hub-ui
        algorithm: HS256
        secret: concert-hub-local-dev-secret-2026

services:

  - name: user-service
    url: http://user-service:5000
    routes:
      - name: auth-routes
        paths:
          - /auth
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:8080
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: true
              max_age: 3600
      - name: user-protected-routes
        paths:
          - /user/events
          - /user/managing
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:8080
              methods:
                - GET
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
              credentials: true
              max_age: 3600
          - name: jwt
            config:
              header_names:
                - authorization
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

  - name: event-service
    url: http://event-service:5000
    routes:
      - name: event-routes
        paths:
          - /events
        methods:
          - GET
        strip_path: false
