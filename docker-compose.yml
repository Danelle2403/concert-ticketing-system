services:

  # ── UI LAYER ────────────────────────────────────────────────
  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html
    ports:
      - "8080:80"
    networks:
      - ticketing-net

  # ── KONG API GATEWAY ─────────────────────────────────────────
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong:/kong/declarative
    ports:
      - "8000:8000"   # API Gateway — your UI calls this
      - "8001:8001"   # Kong Admin API
    networks:
      - ticketing-net
    depends_on:
      - user-service
      - event-service
      - purchase-composite
      - refund-composite
      - edit-event-composite

  # ── USER SERVICE ─────────────────────────────────────────────
  user-service:
    build: ./user-service
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./demo:/demo:ro
    environment:
      - DB_HOST=user-db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=user_db
      - AUTH_TOKEN_ISSUER=${AUTH_TOKEN_ISSUER:-concert-hub-ui}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-concert-hub-local-dev-secret-2026}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-concert-hub-internal-dev-token}
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - ticketing-net

  # ── USER SERVICE DATABASE ────────────────────────────────────
  user-db:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=64
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=user_db
    volumes:
      - user-db-data:/var/lib/mysql
      - ./user-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-net

  # ── SEAT INVENTORY SERVICE ────────────────────────────────────
  seat-inventory:
    build: ./seat-inventory
    restart: unless-stopped
    ports:
      - "5004:5000"
    volumes:
      - ./demo:/demo:ro
    environment:
      - DB_HOST=seat-inventory-db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=seat_inventory_db
      - DEFAULT_HOLD_TTL_SECONDS=300
      - MAX_HOLD_TTL_SECONDS=1800
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    depends_on:
      seat-inventory-db:
        condition: service_healthy
    networks:
      - ticketing-net

  # ── SEAT INVENTORY DATABASE ───────────────────────────────────
  seat-inventory-db:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=64
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=seat_inventory_db
    volumes:
      - seat-inventory-db-data:/var/lib/mysql
      - ./seat-inventory/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-net

  # ── EVENT SERVICE ────────────────────────────────────────────
  event-service:
    build: ./event-service
    ports:
      - "5003:5000"
    volumes:
      - ./demo:/demo:ro
    environment:
      - DATABASE_URL=postgresql://event_user:event_password@event-db:5432/event_service_db
    depends_on:
      event-db:
        condition: service_healthy
    networks:
      - ticketing-net

  # ── EVENT SERVICE DATABASE ───────────────────────────────────
  event-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=event_user
      - POSTGRES_PASSWORD=event_password
      - POSTGRES_DB=event_service_db
    volumes:
      - event-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-net

  # ── TICKET ATOMIC SERVICE ──────────────────────────────────
  ticket-atomic:
    build: ./ticket_atomic
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - ./demo:/demo:ro
    environment:
      - DATABASE_URL=postgresql://ticket_user:ticket_password@ticket-atomic-db:5432/ticket_atomic_db
      - PORT=5000
    depends_on:
      ticket-atomic-db:
        condition: service_healthy
    networks:
      - ticketing-net

  ticket-atomic-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ticket_user
      - POSTGRES_PASSWORD=ticket_password
      - POSTGRES_DB=ticket_atomic_db
    volumes:
      - ticket-atomic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_atomic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-net

  # ── PURCHASE COMPOSITE ──────────────────────────────────────
  purchase-composite:
    build: ./purchase-composite
    restart: unless-stopped
    ports:
      - "5010:5000"
    environment:
      - USER_SERVICE_URL=http://user-service:5000
      - EVENT_SERVICE_URL=http://event-service:5000
      - SEAT_INVENTORY_URL=http://seat-inventory:5000
      - TICKET_SERVICE_URL=http://ticket-atomic:5000
      - PAYMENT_SERVICE_URL=http://payment-service:5000
      - NOTIFICATION_SERVICE_URL=http://notification-service:5000
      - ORDER_SERVICE_URL=https://personal-uq3wxrah.outsystemscloud.com/OrderService/rest/Order
      - PURCHASE_DB_PATH=/data/purchase.db
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-concert-hub-internal-dev-token}
      - CHECKOUT_HOLD_TTL_SECONDS=600
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    volumes:
      - purchase-data:/data
      - ./demo:/demo:ro
    depends_on:
      - user-service
      - event-service
      - seat-inventory
      - ticket-atomic
      - payment-service
      - notification-service
    networks:
      - ticketing-net

  # ── REFUND COMPOSITE ────────────────────────────────────────
  refund-composite:
    build: ./refund-composite
    restart: unless-stopped
    ports:
      - "5011:5000"
    environment:
      - USER_SERVICE_URL=http://user-service:5000
      - PURCHASE_SERVICE_URL=http://purchase-composite:5000
      - SEAT_INVENTORY_URL=http://seat-inventory:5000
      - TICKET_SERVICE_URL=http://ticket-atomic:5000
      - PAYMENT_SERVICE_URL=http://payment-service:5000
      - EVENT_SERVICE_URL=http://event-service:5000
      - NOTIFICATION_SERVICE_URL=http://notification-service:5000
      - CUSTOMER_SUPPORT_EMAIL=${CUSTOMER_SUPPORT_EMAIL:-support@concerthub.local}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-concert-hub-internal-dev-token}
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    depends_on:
      - user-service
      - purchase-composite
      - seat-inventory
      - ticket-atomic
      - payment-service
      - notification-service
      - event-service
    networks:
      - ticketing-net

  # ── PAYMENT WRAPPER ─────────────────────────────────────────
  payment-service:
    build: ./payment-service
    restart: unless-stopped
    ports:
      - "5014:5000"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    networks:
      - ticketing-net

  # ── EDIT EVENT COMPOSITE ────────────────────────────────────
  edit-event-composite:
    build: ./create-edit-event-composite
    restart: unless-stopped
    ports:
      - "5012:5000"
    environment:
      - EVENT_SERVICE_URL=http://event-service:5000
      - USER_SERVICE_URL=http://user-service:5000
      - SEAT_INVENTORY_URL=http://seat-inventory:5000
      - REFUND_SERVICE_URL=http://refund-composite:5000
      - UI_BASE_URL=http://localhost:8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - NOTIFICATION_EXCHANGE=concert.events
      - EVENT_UPDATED_ROUTING_KEY=event.updated
      - EVENT_CANCELLED_ROUTING_KEY=event.cancelled
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-concert-hub-internal-dev-token}
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    depends_on:
      - event-service
      - user-service
      - seat-inventory
      - rabbitmq
    networks:
      - ticketing-net

  # ── NOTIFICATION WRAPPER ────────────────────────────────────
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "5013:5000"
    environment:
      - USER_SERVICE_URL=http://user-service:5000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - NOTIFICATION_EXCHANGE=concert.events
      - NOTIFICATION_QUEUE=notification.event-updated
      - NOTIFICATION_ROUTING_KEYS=event.updated,event.cancelled
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-concert-hub-internal-dev-token}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - FLASK_DEBUG=0
      - FLASK_USE_RELOADER=0
    depends_on:
      - user-service
      - rabbitmq
    networks:
      - ticketing-net

  # ── RABBITMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-net

