  # seat-inventory-service:
  #   build: ./seat-inventory-service
  #   ports:
  #     - "5004:5000"
  #   networks:
  #     - ticketing-net

  # purchase-composite:
  #   build: ./purchase-composite
  #   ports:
  #     - "5010:5000"
  #   networks:
  #     - ticketing-net

  # refund-composite:
  #   build: ./refund-composite
  #   ports:
  #     - "5011:5000"
  #   networks:
  #     - ticketing-net

  # edit-event-composite:
  #   build: ./create-edit-event-composite
  #   ports:
  #     - "5012:5000"
  #   networks:
  #     - ticketing-net

# ── VOLUMES ───────────────────────────────────────────────────
volumes:
  user-db-data:
  seat-inventory-db-data:
  event-postgres-data:
  ticket-atomic-postgres-data:
  purchase-data:

# ── NETWORKS ──────────────────────────────────────────────────
networks:
  ticketing-net:
    driver: bridge
